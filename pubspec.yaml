name: crumb_oven_store
description: Cozy pixel-art bakery store microsite (Flutter Web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  web: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/decor/
    - assets/hero/
    - assets/products/current_menu_7/
    - assets/products/mockup_exact_style/
    - assets/ui/buttons/
    - assets/ui/frames/
    - assets/ui/icons/
    - assets/checkout/
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
